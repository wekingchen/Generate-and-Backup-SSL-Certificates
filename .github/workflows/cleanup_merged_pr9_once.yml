name: 一次性清理已合并 PR9 分支
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup_merged_pr9_once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup-merged-branch:
    if: github.repository == 'wekingchen/Generate-and-Backup-SSL-Certificates' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 验证 PR9 合并状态并清理临时分支
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          merged=$(gh api "repos/$GITHUB_REPOSITORY/pulls/9" --jq '.merged')
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/9" --jq '.head.ref')
          base=$(gh api "repos/$GITHUB_REPOSITORY/pulls/9" --jq '.base.ref')
          if [[ "$merged" != true || "$head" != fix/ssl-full-audit-hardening-20261022 || "$base" != main ]]; then
            echo "::error::PR9 状态或分支不符，拒绝清理。"
            exit 1
          fi
          target="repos/$GITHUB_REPOSITORY/git/refs/heads/fix/ssl-full-audit-hardening-20261022"
          if gh api "$target" >/dev/null 2>&1; then
            gh api --method DELETE "$target"
            echo "✔ 已删除合并后的 PR9 开发分支。"
          else
            echo "✔ PR9 开发分支已经不存在。"
          fi
          gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.name' | grep -Fxq main
          echo "✔ main 分支保留。"

name: Check SSL Certificate Expiry

concurrency:
  group: ssl-certificates-${{ github.repository }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  EMAIL: ${{ secrets.EMAIL }}
  RCLONE_PARAMS: "--transfers=10 --checkers=10 --stats=1s"
  DROPBOX_PATH: "SSL"
  DAYS_BEFORE_EXPIRY: 30

jobs:
  check-and-update-certificates:
    runs-on: ubuntu-latest
    name: Check SSL Certificate Expiry
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install rclone
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          echo "✔ 已安装签名来源的 rclone。"

      - name: Configure rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

      - name: Sync certificates and domain list from Dropbox
        run: |
          set -eo pipefail
          rclone sync dropbox:$DROPBOX_PATH ./ssl $RCLONE_PARAMS --log-file=rclone_sync.log
          rclone copy dropbox:$DROPBOX_PATH/cloudflare_domains_list.txt ./ --log-file=rclone_sync.log
          echo "✔ 已读取证书和域名列表。"

      - name: Check expiry and update report
        run: |
          set -eo pipefail
          git config --global user.email "$EMAIL"
          git config --global user.name "acme-bot"

          # 保持五列结构和域名顺序；仅将标题、缺失提示和显示日期改为中文。
          NOW=$(TZ=Asia/Shanghai date +"%Y年%m月%d日 %H:%M:%S")
          echo "## SSL 证书状态（检查时间：$NOW，北京时间 UTC+8）" > CHECK_LIST.md
          echo "| 域名 | EC 到期时间 | EC 剩余天数 | RSA 到期时间 | RSA 剩余天数 |" >> CHECK_LIST.md
          echo "|---|---|---:|---|---:|" >> CHECK_LIST.md

          check_cert() {
            cert="$1/fullchain.cer"
            key="$1/private.key"
            domain="$2"
            if [ ! -s "$cert" ] || [ ! -s "$key" ]; then
              echo "未找到|0"
              return
            fi
            if ! bash .github/scripts/verify_certificate.sh "$cert" "$key" "$domain" 0 >/dev/null 2>&1; then
              echo "校验失败|0"
              return
            fi
            if ! exp_date=$(openssl x509 -enddate -noout -in "$cert" 2>/dev/null | cut -d= -f2); then
              echo "未找到|0"
              return
            fi
            if ! exp_ts=$(date -d "$exp_date" +%s 2>/dev/null); then
              echo "未找到|0"
              return
            fi
            now_ts=$(date +%s)
            days=$(( (exp_ts - now_ts)/86400 ))
            exp_display=$(TZ=Asia/Shanghai date -d "@$exp_ts" +"%Y年%m月%d日 %H:%M:%S")
            echo "$exp_display|$days"
          }

          if [ ! -s cloudflare_domains_list.txt ]; then
            echo "::error::域名清单不存在或为空。"
            exit 1
          fi
          critical=0
          warnings=0
          checked=0
          while IFS= read -r domain || [ -n "$domain" ]; do
            domain=$(printf '%s' "$domain" | tr -d '\r')
            domain="${domain,,}"
            [ -n "$domain" ] || continue
            case "$domain" in \#*) continue;; esac
            if [[ ! "$domain" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]]; then
              echo "::error::域名清单存在非法条目。"
              exit 1
            fi
            IFS='|' read -r ec_date ec_days <<< "$(check_cert "./ssl/$domain" "$domain")"
            IFS='|' read -r rsa_date rsa_days <<< "$(check_cert "./ssl/$domain/rsa" "$domain")"
            printf "| %s | %s | %d | %s | %d |\n" \
              "$domain" "$ec_date" "$ec_days" "$rsa_date" "$rsa_days" \
              >> CHECK_LIST.md
            checked=$((checked + 1))
            if [ "$ec_days" -le 7 ] || [ "$rsa_days" -le 7 ]; then
              echo "::error::$domain 的证书缺失、无效或剩余有效期不超过 7 天。"
              critical=$((critical + 1))
            elif [ "$ec_days" -le "$DAYS_BEFORE_EXPIRY" ] ||
                 [ "$rsa_days" -le "$DAYS_BEFORE_EXPIRY" ]; then
              echo "::warning::$domain 的证书进入续签窗口，请检查证书管理工作流。"
              warnings=$((warnings + 1))
            else
              echo "✔ $domain 的 EC/RSA 证书仍然有效。"
            fi
          done < cloudflare_domains_list.txt
          if [ "$checked" -eq 0 ]; then
            echo "::error::没有可检查的域名。"
            exit 1
          fi

          if ! git diff --quiet CHECK_LIST.md; then
            git add CHECK_LIST.md
            git commit -m "更新证书状态表：$NOW（北京时间）"
            git push
          else
            echo "CHECK_LIST.md 无变化，跳过提交。"
          fi

          {
            echo "### SSL 证书有效期检查"
            echo "- 已检查域名：$checked"
            echo "- 临期警告：$warnings"
            echo "- 严重异常：$critical"
            echo "- 本工作流只检查与生成报表，不会签发证书或回写 Dropbox。"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$critical" -gt 0 ]; then exit 1; fi

      - name: Cleanup
        if: ${{ always() }}
        run: |
          rm -rf ./ssl cloudflare_domains_list.txt
          echo "✔ 本地临时文件已清理。"

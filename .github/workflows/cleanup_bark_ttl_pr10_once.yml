name: 一次性清理 Bark TTL PR10 分支
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup_bark_ttl_pr10_once.yml
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'wekingchen/Generate-and-Backup-SSL-Certificates' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 确认 PR10 已合并并删除其源分支
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          merged=$(gh api "repos/$GITHUB_REPOSITORY/pulls/10" --jq '.merged')
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/10" --jq '.head.ref')
          base=$(gh api "repos/$GITHUB_REPOSITORY/pulls/10" --jq '.base.ref')
          if [[ "$merged" != true || "$head" != "fix/bark-six-hour-ttl-20261024" || "$base" != main ]]; then
            echo "::error::PR10 未合并或分支不匹配，拒绝删除。"
            exit 1
          fi
          target="repos/$GITHUB_REPOSITORY/git/refs/heads/fix/bark-six-hour-ttl-20261024"
          if gh api "$target" >/dev/null 2>&1; then
            gh api --method DELETE "$target"
            echo "✔ 已删除合并后的 Bark TTL 测试分支。"
          else
            echo "✔ 测试分支已不存在，无须重复删除。"
          fi
          gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.name' | grep -Fxq main
          echo "✔ main 主分支保留。"

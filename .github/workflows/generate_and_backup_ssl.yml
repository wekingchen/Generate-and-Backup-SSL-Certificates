name: Generate and Backup SSL Certificates

concurrency:
  group: ssl-certificates-${{ github.repository }}
  cancel-in-progress: false

on:
  # 临时暂停定时任务：待签发限额恢复并通过修复验证后再启用。
  workflow_dispatch:

env:
  EMAIL: ${{ secrets.EMAIL }}
  CF_TOKEN: ${{ secrets.CF_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  RCLONE_PARAMS: "--transfers=10 --checkers=10 --stats=1s"
  DROPBOX_PATH: "SSL"
  DAYS_BEFORE_EXPIRY: 30
  ACME_PATH: "/home/runner/.acme.sh/acme.sh"

jobs:
  generate-and-backup:
    runs-on: ubuntu-latest
    name: Generate and Backup SSL Certificates
    steps:
      - name: Checkout master
        uses: actions/checkout@v6

      - name: Install rclone and acme.sh
        run: |
          curl https://rclone.org/install.sh | sudo bash
          curl https://get.acme.sh | sh -s email=$EMAIL

      - name: Configure rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

      - name: Sync certificates and domain list from Dropbox
        run: |
          rclone sync dropbox:$DROPBOX_PATH ./ssl $RCLONE_PARAMS --log-file=rclone_sync.log
          rclone copy dropbox:$DROPBOX_PATH/cloudflare_domains_list.txt ./

      - name: Generate SSL Certificates if needed
        id: renew
        env:
          CF_Token: ${{ secrets.CF_TOKEN }}
          CF_Account_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: bash .github/scripts/renew_certificates.sh

      - name: Validate new certificates
        run: |
          set -eo pipefail
          count=0
          while IFS= read -r -d '' cert; do
            key="$(dirname "$cert")/private.key"
            test -s "$key"
            openssl x509 -in "$cert" -noout -checkend 0 >/dev/null
            cert_pub=$(openssl x509 -in "$cert" -pubkey -noout |
              openssl pkey -pubin -outform DER | sha256sum | cut -d ' ' -f1)
            key_pub=$(openssl pkey -in "$key" -pubout -outform DER |
              sha256sum | cut -d ' ' -f1)
            test "$cert_pub" = "$key_pub"
            count=$((count + 1))
          done < <(find ./ssl -name "fullchain.cer" -print0)
          if [ "$count" -eq 0 ]; then
            echo "::error::未找到任何有效证书，拒绝备份。"
            exit 1
          fi
          echo "✔ 已验证 $count 张证书及对应私钥。"

      - name: Backup certificates to Dropbox
        id: backup
        run: |
          rclone sync ssl dropbox:$DROPBOX_PATH $RCLONE_PARAMS

      - name: Backup rclone config
        id: config_backup
        run: |
          rclone copy ~/.config/rclone dropbox:$DROPBOX_PATH/rclone-config $RCLONE_PARAMS

      - name: Cleanup
        if: ${{ always() }}
        run: |
          rm -rf ssl cloudflare_domains_list.txt

      - name: Update RCLONE_CONFIG secret
        id: secret_update
        env:
          CLI_TOKEN: ${{ secrets.CLI_TOKEN }}
        run: |
          echo "${CLI_TOKEN}" | gh auth login --with-token
          gh secret set RCLONE_CONFIG -b"$(cat ~/.config/rclone/rclone.conf)"

      - name: Notify certificate result
        if: ${{ always() && steps.renew.outcome == 'success' }}
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          UPDATED_DOMAINS: ${{ steps.renew.outputs.updated_domains }}
          FAILED_DOMAINS: ${{ steps.renew.outputs.failed_domains }}
        run: |
          if [ -z "$BARK_URL" ] || { [ -z "$UPDATED_DOMAINS" ] && [ -z "$FAILED_DOMAINS" ]; }; then
            echo "无须发送 Bark 通知。"
            exit 0
          fi
          body="已更新：$UPDATED_DOMAINS；失败：$FAILED_DOMAINS"
          encoded=$(jq -rn --arg body "$body" '$body|@uri')
          curl -fsS --max-time 15 -X POST "$BARK_URL/SSL%20Updated/$encoded" ||
            echo "::warning::Bark 通知失败，不影响证书备份结果。"

      - name: Report final result
        if: ${{ always() }}
        run: |
          if [ "${{ steps.renew.outcome }}" != "success" ] ||
             [ "${{ steps.backup.outcome }}" != "success" ] ||
             [ "${{ steps.config_backup.outcome }}" != "success" ] ||
             [ "${{ steps.secret_update.outcome }}" != "success" ] ||
             [ "${{ steps.renew.outputs.had_failures }}" = "true" ]; then
            echo "::error::存在证书签发、校验或备份失败，请查看上方中文汇总。"
            exit 1
          fi
          echo "✔ 证书处理与 Dropbox 备份均已完成。"

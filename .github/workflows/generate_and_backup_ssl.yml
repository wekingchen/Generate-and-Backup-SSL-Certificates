name: Generate and Backup SSL Certificates

concurrency:
  group: ssl-certificates-${{ github.repository }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "35 23 * * *"
  workflow_dispatch:
    inputs:
      ca:
        description: "签发机构（auto=Let's Encrypt，备份由仓库变量控制；google 仅供手动试验）"
        required: true
        type: choice
        options:
          - auto
          - letsencrypt
          - zerossl
          - google
        default: auto

permissions:
  contents: read

env:
  EMAIL: ${{ secrets.EMAIL }}
  RCLONE_PARAMS: "--transfers=10 --checkers=10 --stats=1s"
  DROPBOX_PATH: "SSL"
  DAYS_BEFORE_EXPIRY: 30
  ACME_PATH: "/home/runner/.acme.sh/acme.sh"

jobs:
  generate-and-backup:
    runs-on: ubuntu-latest
    name: Generate and Backup SSL Certificates
    steps:
      - name: Checkout master
        uses: actions/checkout@v6

      - name: 安装并校验证书签发依赖
        shell: bash
        run: bash .github/scripts/install_dependencies.sh

      - name: Configure rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

      - name: Sync certificates and domain list from Dropbox
        run: |
          rclone sync dropbox:$DROPBOX_PATH ./ssl $RCLONE_PARAMS --log-file=rclone_sync.log
          rclone copy dropbox:$DROPBOX_PATH/cloudflare_domains_list.txt ./

      - name: Generate SSL Certificates if needed
        id: renew
        env:
          CF_Token: ${{ secrets.CF_TOKEN }}
          CF_Account_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SSL_CA_MODE: ${{ inputs.ca || 'auto' }}
          SSL_FALLBACK_CA: ${{ vars.SSL_FALLBACK_CA || 'off' }}
          ZEROSSL_EAB_KID: ${{ secrets.ZEROSSL_EAB_KID }}
          ZEROSSL_EAB_HMAC_KEY: ${{ secrets.ZEROSSL_EAB_HMAC_KEY }}
          GOOGLE_EAB_KID: ${{ secrets.GOOGLE_EAB_KID }}
          GOOGLE_EAB_HMAC_KEY: ${{ secrets.GOOGLE_EAB_HMAC_KEY }}
        run: bash .github/scripts/renew_certificates.sh

      - name: 校验证书链、域名与私钥完整性
        id: validate
        shell: bash
        run: bash .github/scripts/verify_inventory.sh
      - name: 防止 Dropbox 远端文件被误删
        id: remote_guard
        shell: bash
        run: bash .github/scripts/guard_dropbox_deletions.sh

      - name: Backup certificates to Dropbox
        id: backup
        run: |
          rclone sync ssl dropbox:$DROPBOX_PATH $RCLONE_PARAMS

      - name: Backup rclone config
        id: config_backup
        run: |
          rclone copy ~/.config/rclone dropbox:$DROPBOX_PATH/rclone-config $RCLONE_PARAMS

      - name: Cleanup
        if: ${{ always() }}
        run: |
          rm -rf ssl cloudflare_domains_list.txt

      - name: Update RCLONE_CONFIG secret
        id: secret_update
        env:
          CLI_TOKEN: ${{ secrets.CLI_TOKEN }}
        run: |
          echo "${CLI_TOKEN}" | gh auth login --with-token
          gh secret set RCLONE_CONFIG -b"$(cat ~/.config/rclone/rclone.conf)"

      - name: Notify certificate result
        # 也通知校验或备份失败，不能让“更新成功”的推送掩盖后续失败。
        if: ${{ always() }}
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          UPDATED_CERTIFICATES: ${{ steps.renew.outputs.updated_certificates }}
          FAILED_CERTIFICATES: ${{ steps.renew.outputs.failed_domains }}
          DEFERRED_CERTIFICATES: ${{ steps.renew.outputs.deferred_certificates }}
          CRITICAL_DEFERRED_CERTIFICATES: ${{ steps.renew.outputs.critical_deferred_certificates }}
          HAD_CRITICAL_DEFERRED: ${{ steps.renew.outputs.had_critical_deferred }}
          INVENTORY_MISSING: ${{ steps.validate.outputs.inventory_missing }}
          HAD_INVENTORY_GAPS: ${{ steps.validate.outputs.had_inventory_gaps }}
          CHECKED_DOMAINS: ${{ steps.renew.outputs.checked_domains }}
          VALID_SKIPPED: ${{ steps.renew.outputs.valid_skipped }}
          ISSUE_ATTEMPTS: ${{ steps.renew.outputs.ca_orders }}
          CERTIFICATE_ISSUERS: ${{ steps.renew.outputs.certificate_issuers }}
          HAD_FAILURES: ${{ steps.renew.outputs.had_failures }}
          RENEW_OUTCOME: ${{ steps.renew.outcome }}
          VERIFY_OUTCOME: ${{ steps.validate.outcome }}
          GUARD_OUTCOME: ${{ steps.remote_guard.outcome }}
          BACKUP_OUTCOME: ${{ steps.backup.outcome }}
          CONFIG_BACKUP_OUTCOME: ${{ steps.config_backup.outcome }}
          SECRET_UPDATE_OUTCOME: ${{ steps.secret_update.outcome }}
        run: bash .github/scripts/notify_bark.sh

      - name: Report final result
        if: ${{ always() }}
        run: |
          if [ "${{ steps.renew.outcome }}" != "success" ] ||
             [ "${{ steps.backup.outcome }}" != "success" ] ||
             [ "${{ steps.config_backup.outcome }}" != "success" ] ||
             [ "${{ steps.secret_update.outcome }}" != "success" ] ||
             [ "${{ steps.renew.outputs.had_failures }}" = "true" ] ||
             [ "${{ steps.renew.outputs.had_critical_deferred }}" = "true" ] ||
             [ "${{ steps.validate.outputs.had_inventory_gaps }}" = "true" ] ||
             [ "${{ steps.validate.outcome }}" != "success" ] ||
             [ "${{ steps.remote_guard.outcome }}" != "success" ]; then
            echo "::error::存在证书签发、校验或备份失败，请查看上方中文汇总。"
            exit 1
          fi
          echo "✔ 证书处理与 Dropbox 备份均已完成。"

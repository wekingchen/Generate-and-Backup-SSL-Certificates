name: SSL Single EC Production Acceptance
on:
  push:
    branches: [fix/ssl-renewal-reliability-20261016]
    paths: [.github/workflows/ssl_production_canary.yml]
permissions:
  contents: read
concurrency:
  group: ssl-production-acceptance-${{ github.repository }}
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EMAIL: ${{ secrets.EMAIL }}
      CF_Token: ${{ secrets.CF_TOKEN }}
      CF_Account_ID: ${{ secrets.CF_ACCOUNT_ID }}
      ACME_PATH: /home/runner/.acme.sh/acme.sh
      DAYS_BEFORE_EXPIRY: "30"
      SSL_ONLY_DOMAIN: myddns.plus
      SSL_ONLY_TYPE: EC
      DROPBOX_PATH: SSL
      RCLONE_PARAMS: "--transfers=10 --checkers=10 --stats=1s"
    steps:
      - name: Checkout tested branch
        uses: actions/checkout@v6
      - name: Install rclone and acme.sh
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_Token"
          test -n "$CF_Account_ID"
          test -n "$EMAIL"
          curl -fsSL https://rclone.org/install.sh | sudo bash
          curl -fsSL https://get.acme.sh | sh -s email="$EMAIL"
          test -f "$ACME_PATH"
      - name: Configure rclone without printing credentials
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG"
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: Read all existing certs via unchanged Dropbox download commands
        shell: bash
        run: |
          set -euo pipefail
          rclone sync dropbox:$DROPBOX_PATH ./ssl $RCLONE_PARAMS --log-file=rclone_canary_read.log
          rclone copy dropbox:$DROPBOX_PATH/cloudflare_domains_list.txt ./
      - name: Guard snapshot before any certificate issuance
        shell: bash
        run: |
          set -euo pipefail
          test -s cloudflare_domains_list.txt
          grep -Fxq "$SSL_ONLY_DOMAIN" cloudflare_domains_list.txt
          if grep -Eiq '^sqqq\.cf\r?$' cloudflare_domains_list.txt; then
            echo "::error::旧域名仍在 Dropbox 列表中。"
            exit 1
          fi
          test -s "ssl/$SSL_ONLY_DOMAIN/fullchain.cer"
          test -s "ssl/$SSL_ONLY_DOMAIN/private.key"
          test -s "ssl/$SSL_ONLY_DOMAIN/rsa/fullchain.cer"
          test -s "ssl/$SSL_ONLY_DOMAIN/rsa/private.key"
          count=$(find ssl -name fullchain.cer | wc -l)
          [[ "$count" -eq 12 ]]
          find ssl -type f ! -path "ssl/$SSL_ONLY_DOMAIN/fullchain.cer" \
            ! -path "ssl/$SSL_ONLY_DOMAIN/private.key" \
            ! -path "ssl/$SSL_ONLY_DOMAIN/ca.cer" \
            ! -path "ssl/$SSL_ONLY_DOMAIN/EC_issue.log" -print0 |
            LC_ALL=C sort -z | xargs -0 -r sha256sum > /tmp/unchanged_cert_hashes
      - name: Issue exactly one EC certificate through production Let's Encrypt
        id: renew
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/renew_certificates.sh
      - name: Verify replacement and all unrelated files remain unchanged
        shell: bash
        env:
          UPDATED: ${{ steps.renew.outputs.updated_domains }}
          FAILED: ${{ steps.renew.outputs.failed_domains }}
          HAD_FAILURES: ${{ steps.renew.outputs.had_failures }}
        run: |
          set -euo pipefail
          [[ "$UPDATED" == "$SSL_ONLY_DOMAIN" && "$FAILED" == "" && "$HAD_FAILURES" == false ]]
          sha256sum -c /tmp/unchanged_cert_hashes >/dev/null
          cert="ssl/$SSL_ONLY_DOMAIN/fullchain.cer"
          key="ssl/$SSL_ONLY_DOMAIN/private.key"
          openssl x509 -in "$cert" -noout -checkend $((DAYS_BEFORE_EXPIRY*86400)) >/dev/null
          openssl x509 -in "$cert" -noout -checkhost "$SSL_ONLY_DOMAIN" >/dev/null
          openssl x509 -in "$cert" -noout -checkhost "test.$SSL_ONLY_DOMAIN" >/dev/null
          a=$(openssl x509 -in "$cert" -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)
          b=$(openssl pkey -in "$key" -pubout -outform DER | sha256sum | cut -d' ' -f1)
          [[ "$a" == "$b" ]]
          echo "✔ 已验证 myddns.plus 的新 EC 证书及所有未选择的旧文件。"
      - name: Protect remote files from accidental deletion
        shell: bash
        run: |
          set -euo pipefail
          rclone lsf dropbox:$DROPBOX_PATH -R --files-only | LC_ALL=C sort > /tmp/remote_files
          ( cd ssl && find . -type f -printf '%P\n' | LC_ALL=C sort ) > /tmp/local_files
          comm -23 /tmp/remote_files /tmp/local_files > /tmp/would_delete
          if [[ -s /tmp/would_delete ]]; then
            echo "::error::检测到可能被同步删除的远端文件，已阻止 Dropbox 写入。"
            echo "受影响文件数: $(wc -l < /tmp/would_delete)"
            exit 1
          fi
          echo "✔ 远端清单检查通过，未发现意外删除风险。"
      - name: Back up using the original Dropbox sync command
        shell: bash
        run: |
          set -euo pipefail
          rclone sync ssl dropbox:$DROPBOX_PATH $RCLONE_PARAMS
      - name: Read back the single backed-up pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ssl_canary_readback
          rclone copyto "dropbox:$DROPBOX_PATH/$SSL_ONLY_DOMAIN/fullchain.cer" /tmp/ssl_canary_readback/fullchain.cer
          rclone copyto "dropbox:$DROPBOX_PATH/$SSL_ONLY_DOMAIN/private.key" /tmp/ssl_canary_readback/private.key
          cmp -s "ssl/$SSL_ONLY_DOMAIN/fullchain.cer" /tmp/ssl_canary_readback/fullchain.cer
          cmp -s "ssl/$SSL_ONLY_DOMAIN/private.key" /tmp/ssl_canary_readback/private.key
          echo "### 单域名生产验证通过" >> "$GITHUB_STEP_SUMMARY"
          echo "myddns.plus：只更新 EC P-256；RSA 与其他域名文件校验保持原样；远端证书与本地一致。" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean local private material
        if: always()
        run: |
          rm -rf ./ssl ./cloudflare_domains_list.txt ~/.config/rclone ~/.acme.sh /tmp/ssl_canary_readback
          rm -f /tmp/unchanged_cert_hashes /tmp/remote_files /tmp/local_files /tmp/would_delete rclone_canary_read.log
